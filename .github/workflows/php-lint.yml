name: PHP syntax check

on:
  push:
    branches:
      - main
      - 'prelaunch/**'
  pull_request:
    branches:
      - main

jobs:
  php-lint:
    name: Lint PHP source files
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Lint all PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name '*.php' -not -path './.git/*' -print0)
          if (("${#files[@]}" == 0)); then
            echo "No PHP files were found."
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Checking ${file}"
            php -l "${file}"
          done
      - name: Verify product catalogue consistency
        run: php tests/check-shop-catalog.php
