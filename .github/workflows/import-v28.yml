name: Import ESSO V28 non-image source

on:
  push:
    paths:
      - '._esso_import/ESSO_V28_NONIMAGE.b64'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/esso_import
          base64 -d '._esso_import/ESSO_V28_NONIMAGE.b64' > /tmp/esso_import/site.tar.gz
          tar -xzf /tmp/esso_import/site.tar.gz -C /tmp/esso_import
          find /tmp/esso_import -type f -name '.env' -delete
          rm -rf /tmp/esso_import/.git

          # Copy every V28 non-image file into the repository.
          cp -a /tmp/esso_import/. .

          # Remove the temporary import bundle from the repo.
          rm -rf '._esso_import'

      - name: Commit imported V28 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No source changes detected."
            exit 0
          fi
          git commit -m "Import ESSO V28 source without images"
          git push
